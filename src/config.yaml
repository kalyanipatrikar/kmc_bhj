# ---------------------------------------------------------------------------
# MLIP toolkit - run configuration
#
# This is the only file you normally edit. Every stage reads it, and every
# stage writes its outputs under project.out_dir.
#
#   python -m src.stage1_pair_structure
#   python -m src.stage2_generate_configs
#   python -m src.stage3_transfer_integrals
#   python -m src.stage4_random_walk
#   python -m src.stage5_mobility
#
# or all five:  python scripts/run_all.py
# ---------------------------------------------------------------------------

project:
  name: AQx-2
  data_dir: data
  out_dir: out_folder


# ---------------------------------------------------------------------------
# Stage 1: crystal structure -> stacked dimer motifs
# ---------------------------------------------------------------------------
crystal:
  cif: 2161927.cif

  # Translations of the unit cell built around the origin. (-2..2) is a 5x5x5
  # block, which is enough for a full neighbour shell of any organic molecule.
  supercell: [-2, -1, 0, 1, 2]

  contact_cutoff: 4.5      # A; two molecules are neighbours below this
  min_contacts: 20         # heavy-atom pairs; below this it is a tip touch,
                           # not a stacked pair
  bond_tolerance: 1.15     # bonded if d < tol * (r_cov_i + r_cov_j)
  max_motifs: 4            # write at most this many, ranked by contact count

  # X-H bond lengths used when a chain attachment point is capped
  cap_lengths: {C: 1.09, N: 1.01, O: 0.96, S: 1.34}

  # ---- Fragment selection ------------------------------------------------
  # The conjugated core is detected automatically: sp3 carbons are removed,
  # and the largest remaining connected system is the core. Everything below
  # is an override for when that heuristic misfires - all of it can stay empty.
  selection:
    drop_disorder_groups: ["2", "-2"]   # minor disorder components
    min_component_size: 8               # drop connected components smaller
                                        # than this from the asymmetric unit
                                        # (this is what removes solvent)
    core_labels: null      # explicit core, e.g. [C1, C2, N1, ...]. null = auto
    keep_labels: []        # force these into the core
    drop_labels: []        # force these out of the core


# ---------------------------------------------------------------------------
# Stage 2: MACE molecular dynamics -> thermally sampled configurations
# ---------------------------------------------------------------------------
md:
  model: medium            # mace_off model size
  temperature: 300.0       # K
  timestep: 0.5            # fs; keeps the C-H stretches resolved
  friction: 0.01           # 1/fs; weak enough not to overdamp the stack
  equilibration_fs: 5000.0 # discarded
  sample_spacing_fs: 1000.0   # past the librational correlation time, so
                              # frames are independent
  n_configs: 40            # per motif
  equil_chunk_fs: 500.0    # checkpoint this often during equilibration

  # Vacuum has no lattice holding the pair together. A flat-bottom restraint
  # exerts no force until the centres of mass separate by more than their
  # starting distance plus this margin, so it prevents the pair drifting apart
  # without biasing the geometries actually sampled.
  com_margin: 2.5          # A
  k_restraint: 2.0         # eV/A^2

  relax_fmax: 0.05         # eV/A, hydrogen-only relaxation
  relax_steps: 500


# ---------------------------------------------------------------------------
# Stage 3: DFT -> transfer integrals
# ---------------------------------------------------------------------------
dft:
  basis: def2-svp          # no diffuse functions: at 3 A contact they cause
                           # linear dependence in the dimer basis for no gain
  xc: b3lyp                # pyscf's "b3lyp" is the VWN5 form; "b3lypg"
                           # reproduces Gaussian's
  mode: superposition      # superposition | dimer_scf
  conv_tol: 1.0e-7
  grid_level: 1
  max_cycle: 100
  n_threads: null          # null = os.cpu_count()

  # Frontier orbitals are often near-degenerate in an acceptor. Any orbital
  # within this window of the frontier one joins it as a manifold, and the
  # coupling is computed between the two manifolds instead of between two
  # single orbitals. With a window of 0 this reduces exactly to the
  # single-orbital result, and it costs no extra SCF either way.
  degeneracy_window: 0.10  # eV
  max_manifold: 4          # orbitals per monomer, at most

  n_sample: 10             # total frames sent to DFT, across all motifs
  stratify: true           # equal count per motif rather than a uniform draw
                           # over the pooled configurations
  seed: 0                  # fixed, so a rerun picks the same frames
  pool_weighting: multiplicity   # multiplicity | uniform; how per-motif J
                                 # values are mixed into the pooled J.txt


# ---------------------------------------------------------------------------
# Stage 4: kinetic Monte Carlo random walk
# ---------------------------------------------------------------------------
transport:
  j_file: J.txt            # pooled couplings written by stage 3, in meV and
                           # read as meV - there is no conversion layer
  lattice: [800, 800, 800] # L, W, H
  trials: 400
  steps: 6000
  temperature: 300.0       # K
  sigma: 0.10              # eV, Gaussian site energy disorder
  reorganisation_energy: 0.10   # eV
  shift_sigma: 0.10        # width of the |N(0, s)| positional shift that
                           # attenuates J as exp(-dx)
  seed: 0


# ---------------------------------------------------------------------------
# Stage 5: mobility from the trajectories
# ---------------------------------------------------------------------------
mobility:
  intersite_distance: 3.27 # A; null takes the mean COM distance from
                           # motifs.csv instead
  time_bin: 1.0e-10        # s
  n_bins: 100
  fit_from: 15             # skip the early bins, where the walk has not yet
                           # reached the diffusive regime
  dimensionality: 3        # the 6 in D = MSD / (2 d t)
